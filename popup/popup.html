<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextDict - Sổ từ vựng</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header with Liquid Specular Sheen -->
      <header class="popup-header">
        <div class="header-left">
          <img
            src="../icons/icon-48.png"
            alt="ContextDict Logo"
            class="logo-img"
          />
          <div>
            <h1 class="logo-title">ContextDict</h1>
            <span class="logo-subtitle">Sổ từ vựng & Dịch ngữ cảnh</span>
          </div>
        </div>
        <div class="header-right">
          <nat-badge id="vocabCountBadge" value="0" color="primary" title="Tổng số từ đã lưu"></nat-badge>
          <nat-icon-button
            type="button"
            id="openOptionsBtn"
            size="small"
            variant="standard"
            title="Mở Cài đặt toàn màn hình"
            aria-label="Mở Cài đặt toàn màn hình"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </nat-icon-button>
          <nat-switch id="toggleEnabled" checked aria-label="Bật/Tắt tiện ích" title="Bật/Tắt tiện ích"></nat-switch>
        </div>
      </header>

      <!-- Smart API Key Reminder Banner -->
      <div id="apiKeyBanner" class="api-key-banner hidden">
        <div class="banner-content">
          <span class="banner-icon" aria-hidden="true">🔑</span>
          <div class="banner-text">
            <strong>Chưa cấu hình API Key</strong>
            <p>Mở Cài đặt để thêm key và kích hoạt dịch thuật AI.</p>
          </div>
        </div>
        <nat-button type="button" id="bannerOpenOptionsBtn" variant="filled">
          Cài đặt ↗
        </nat-button>
      </div>

      <!-- Main Vocabulary Content View -->
      <main class="popup-main-content">
        <section id="vocabularyTab" class="vocab-section">
          <!-- Vocab Header & Search -->
          <div class="vocab-controls">
            <div class="search-wrap">
              <nat-input
                id="searchVocab"
                placeholder="Tìm kiếm từ vựng đã lưu…"
                clearable
                variant="outlined"
                size="small"
                aria-label="Tìm kiếm từ vựng đã lưu"
              >
                <svg
                  slot="leading-icon"
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </nat-input>
            </div>
            <!-- Language Filter Tabs (All / English / Korean) -->
            <div class="vocab-lang-filters" id="vocabLangFilters" role="tablist" aria-label="Lọc theo ngôn ngữ">
              <button type="button" class="lang-pill active" data-lang="all" role="tab" aria-selected="true">Tất cả</button>
              <button type="button" class="lang-pill" data-lang="en" role="tab" aria-selected="false">English</button>
              <button type="button" class="lang-pill" data-lang="ko" role="tab" aria-selected="false">한국어</button>
            </div>
            <!-- Quick Interactive Model Selector -->
            <div class="quick-model-bar">
              <label for="quickModelSelect" class="quick-model-label">
                <span class="quick-model-dot" id="quickModelDot" title="Mô hình đang sẵn sàng"></span>
                <span>Mô hình AI:</span>
              </label>
              <div class="quick-model-select-wrap">
                <select id="quickModelSelect" class="quick-model-select" title="Chọn nhanh mô hình AI dịch thuật">
                  <optgroup label="⚡ Miễn phí (Free Tier — Khuyên dùng)">
                    <option value="google/gemma-4-26b-a4b-it:free">Google: Gemma 4 26B</option>
                    <option value="google/gemma-4-31b-it:free">Google: Gemma 4 31B</option>
                    <option value="nvidia/nemotron-3.5-lightning:free">NVIDIA: Nemotron 3.5</option>
                    <option value="nvidia/nemotron-3-super-120b-a12b:free">NVIDIA: Nemotron 120B</option>
                    <option value="thinkingmachines/inkling:free">Thinking Machines: Inkling</option>
                    <option value="deepseek/deepseek-r1:free">DeepSeek: DeepSeek R1</option>
                  </optgroup>
                  <optgroup label="💎 Cao cấp (OpenRouter)">
                    <option value="google/gemini-2.5-flash">Google: Gemini 2.5 Flash</option>
                    <option value="google/gemini-2.5-pro">Google: Gemini 2.5 Pro</option>
                    <option value="anthropic/claude-3.5-sonnet">Anthropic: Claude 3.5 Sonnet</option>
                    <option value="openai/gpt-4o-mini">OpenAI: GPT-4o Mini</option>
                    <option value="openai/gpt-4o">OpenAI: GPT-4o</option>
                    <option value="deepseek/deepseek-chat">DeepSeek: DeepSeek V3</option>
                  </optgroup>
                  <optgroup label="⚙️ Tuỳ chọn">
                    <option value="__open_options__">⚙️ Cài đặt & Đo độ trễ…</option>
                  </optgroup>
                </select>
                <svg class="select-chevron" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
              <span id="quickModelScoreBadge" class="quick-model-score grade-none" title="Chưa có dữ liệu đánh giá">—</span>
            </div>
            <div class="vocab-actions-bar">
              <span id="vocabSummaryText">0 từ vựng</span>
              <div class="vocab-btn-group">
                <nat-button
                  type="button"
                  id="exportVocabBtn"
                  variant="outlined"
                  title="Xuất dữ liệu JSON"
                >
                  <svg
                    slot="icon"
                    viewBox="0 0 24 24"
                    width="12"
                    height="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Xuất file</span>
                </nat-button>
                <nat-button
                  type="button"
                  id="clearVocabBtn"
                  variant="outlined"
                  class="btn-danger"
                  title="Xoá toàn bộ"
                >
                  <svg
                    slot="icon"
                    viewBox="0 0 24 24"
                    width="12"
                    height="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path
                      d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                    ></path>
                  </svg>
                  <span>Xoá hết</span>
                </nat-button>
              </div>
            </div>
          </div>

          <!-- Vocab List Container -->
          <div id="vocabList" class="vocab-list">
            <!-- Cards populated by JS -->
          </div>

          <!-- Empty State -->
          <div id="vocabEmpty" class="empty-state hidden">
            <div class="empty-state-illustration" aria-hidden="true">
              <svg viewBox="0 0 160 160" width="125" height="125" fill="none" class="empty-state-svg">
                <defs>
                  <linearGradient id="bookCoverGrad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#4f46e5" />
                    <stop offset="100%" stop-color="#1e1b4b" />
                  </linearGradient>
                  <linearGradient id="glassLensGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
                    <stop offset="100%" stop-color="rgba(99, 102, 241, 0.15)" />
                  </linearGradient>
                  <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                  </filter>
                </defs>
                <!-- Background Aura Glow -->
                <circle cx="80" cy="78" r="46" fill="rgba(99, 102, 241, 0.28)" filter="url(#auraGlow)" />
                <!-- Book Backing -->
                <rect x="36" y="32" width="74" height="92" rx="12" fill="#080d1a" opacity="0.7" transform="rotate(-5 36 32)" />
                <!-- Main Book Cover -->
                <rect x="42" y="28" width="74" height="92" rx="10" fill="url(#bookCoverGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
                <!-- Spine Highlights -->
                <line x1="48" y1="30" x2="48" y2="118" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
                <!-- Ribbon -->
                <path d="M60 120 L60 136 L67 130 L74 136 L74 120 Z" fill="#38bdf8" />
                <!-- Preview Text Lines -->
                <rect x="58" y="44" width="44" height="3.5" rx="1.75" fill="rgba(255, 255, 255, 0.35)" />
                <rect x="58" y="53" width="32" height="3.5" rx="1.75" fill="rgba(255, 255, 255, 0.22)" />
                <!-- Floating Liquid Magnifying Glass -->
                <g transform="translate(10, 8)">
                  <circle cx="86" cy="72" r="23" fill="url(#glassLensGrad)" stroke="#38bdf8" stroke-width="2.5" />
                  <circle cx="86" cy="72" r="17" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />
                  <text x="86" y="76" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">word</text>
                  <line x1="70" y1="88" x2="52" y2="106" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
                  <line x1="70" y1="88" x2="52" y2="106" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round" />
                </g>
                <!-- Sparkles -->
                <path d="M126 34 L128 40 L134 42 L128 44 L126 50 L124 44 L118 42 L124 40 Z" fill="#38bdf8" />
                <path d="M28 82 L29 86 L33 87 L29 88 L28 92 L27 88 L23 87 L27 86 Z" fill="#818cf8" />
                <circle cx="126" cy="94" r="2" fill="#7dd3fc" />
                <circle cx="42" cy="22" r="1.8" fill="#a78bfa" />
              </svg>
            </div>
            <h3>Chưa có từ vựng nào</h3>
            <p>
              Khi duyệt web, hover lên từ bất kỳ và bấm biểu tượng ngôi sao để lưu vào sổ từ vựng này.
            </p>
          </div>
        </section>
      </main>

      <!-- Liquid Glass Footer -->
      <footer class="popup-footer">
        <nat-button type="button" id="footerOptionsLink" variant="text" title="Mở cài đặt toàn màn hình">
          <svg slot="icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Cài đặt nâng cao</span>
        </nat-button>
        <span class="status-indicator"><span class="dot"></span> Hoạt động</span>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
